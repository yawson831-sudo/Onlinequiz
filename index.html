<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>School App</title>

<style>
body{
  margin:0;
  font-family:Arial;
  background:#0b1220;
  color:white;
}

/* TOP BAR */
header{
  background:#1e293b;
  padding:15px;
  text-align:center;
  font-weight:bold;
}

/* NAV BAR */
nav{
  position:fixed;
  bottom:0;
  width:100%;
  display:flex;
  background:#1e293b;
}

nav button{
  flex:1;
  padding:12px;
  border:none;
  background:none;
  color:white;
  font-size:14px;
}

/* PAGES */
.page{
  display:none;
  padding:20px;
  padding-bottom:80px;
}

.active{
  display:block;
}

/* CARD */
.card{
  background:#111827;
  padding:15px;
  border-radius:10px;
  margin-top:10px;
}

/* INPUT */
input{
  width:100%;
  padding:12px;
  margin-top:10px;
  border:none;
  border-radius:6px;
}

/* BUTTON */
button.action{
  width:100%;
  padding:12px;
  margin-top:10px;
  background:#22c55e;
  border:none;
  color:white;
  border-radius:6px;
}

/* ADMIN */
#adminPage{display:none}
.smallBtn{
  background:#38bdf8;
}
</style>
</head>

<body>

<header>📱 School Mobile App</header>

<!-- HOME PAGE -->
<div id="home" class="page active">

<h3>🎓 Check Result</h3>

<input id="indexInput" placeholder="Enter Index Number">
<button class="action" onclick="checkResult()">Search</button>

<div class="card" id="resultCard" style="display:none">
<p id="resultText"></p>
</div>

</div>

<!-- RESULTS PAGE -->
<div id="results" class="page">

<h3>📊 All Results</h3>
<div id="allResults"></div>

</div>

<!-- ADMIN PAGE -->
<div id="admin" class="page">

<h3>🧑‍🏫 Admin Login</h3>

<input type="password" id="adminPass" placeholder="Enter Password">
<button class="action" onclick="loginAdmin()">Login</button>

<div id="adminPanel" style="display:none">

<h4>Add Student</h4>

<input id="aIndex" placeholder="Index">
<input id="aName" placeholder="Name">
<input id="aScore" placeholder="Score">

<button class="action" onclick="addStudent()">Add</button>

<p id="msg"></p>

</div>

</div>

<!-- NAV -->
<nav>
<button onclick="showPage('home')">Home</button>
<button onclick="showPage('results')">Results</button>
<button onclick="showPage('admin')">Admin</button>
</nav>

<script>

let students = JSON.parse(localStorage.getItem("students")) || [
  {index:"S001",name:"Kojo Mensah",score:85,grade:"A"},
  {index:"S002",name:"Ama Serwaa",score:70,grade:"B"}
];

// PAGE SWITCH
function showPage(page){
  document.querySelectorAll(".page").forEach(p=>p.classList.remove("active"));
  document.getElementById(page).classList.add("active");

  if(page==="results") loadAll();
}

// CHECK RESULT
function checkResult(){
  let index = document.getElementById("indexInput").value;
  let found = students.find(s=>s.index===index);

  let card = document.getElementById("resultCard");
  let text = document.getElementById("resultText");

  if(!found){
    text.innerHTML="❌ Not Found";
    card.style.display="block";
    return;
  }

  text.innerHTML=`
  <b>${found.name}</b><br>
  Index: ${found.index}<br>
  Score: ${found.score}<br>
  Grade: ${found.grade}
  `;

  card.style.display="block";

  sendWhatsApp(found);
}

// WHATSAPP
function sendWhatsApp(s){
  let phone="233208333632";

  let msg=`Result Ready:%0A${s.name}%0A${s.score}%0A${s.grade}`;

  window.open(`https://wa.me/${phone}?text=${msg}`,"_blank");
}

// LOAD ALL RESULTS
function loadAll(){
  let div=document.getElementById("allResults");
  div.innerHTML="";

  students.forEach(s=>{
    div.innerHTML+=`
    <div class="card">
    <b>${s.name}</b><br>
    ${s.index} | ${s.score} | ${s.grade}
    </div>`;
  });
}

// ADMIN LOGIN
function loginAdmin(){
  let pass=document.getElementById("adminPass").value;

  if(pass==="admin123"){
    document.getElementById("adminPanel").style.display="block";
  }else{
    alert("Wrong password");
  }
}

// ADD STUDENT
function addStudent(){
  let i=document.getElementById("aIndex").value;
  let n=document.getElementById("aName").value;
  let s=parseInt(document.getElementById("aScore").value);

  let g=s>=80?"A":s>=70?"B":s>=60?"C":s>=50?"D":"F";

  students.push({index:i,name:n,score:s,grade:g});
  localStorage.setItem("students",JSON.stringify(students));

  document.getElementById("msg").innerText="✅ Added";
}

</script>

</body>
</html>
