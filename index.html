<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Julio Maths CBT</title>

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

body{
  font-family:Arial, sans-serif;
  background:#f5f5f5;
  overflow:hidden;
}

/* Loading Screen */
#loader{
  position:fixed;
  width:100%;
  height:100vh;
  background:#ffffff;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  z-index:9999;
  animation:fadeOut 1s ease forwards;
  animation-delay:3s;
}

.loader-circle{
  width:60px;
  height:60px;
  border:6px solid #ddd;
  border-top:6px solid #0b57d0;
  border-radius:50%;
  animation:spin 1s linear infinite;
}

.loader-text{
  margin-top:20px;
  font-size:22px;
  font-weight:bold;
  color:#0b57d0;
}

@keyframes spin{
  100%{
    transform:rotate(360deg);
  }
}

@keyframes fadeOut{
  to{
    opacity:0;
    visibility:hidden;
  }
}

/* Main App */
#app{
  display:none;
  animation:slideUp .7s ease;
}

@keyframes slideUp{
  from{
    opacity:0;
    transform:translateY(30px);
  }
  to{
    opacity:1;
    transform:translateY(0);
  }
}

/* Header */
header{
  background:#0b57d0;
  color:white;
  text-align:center;
  padding:18px;
  font-size:22px;
  font-weight:bold;
  box-shadow:0 2px 8px rgba(0,0,0,.2);
}

/* Container */
.container{
  padding:20px;
}

/* Card */
.card{
  background:white;
  border-radius:14px;
  padding:20px;
  margin-top:20px;
  box-shadow:0 2px 12px rgba(0,0,0,.1);
}

/* Info */
.info{
  display:flex;
  justify-content:space-between;
  margin-top:10px;
}

.info-box{
  background:#f1f5f9;
  padding:12px;
  border-radius:10px;
  width:48%;
  text-align:center;
}

.label{
  font-size:13px;
  color:gray;
}

.value{
  font-size:18px;
  font-weight:bold;
  margin-top:4px;
}

/* Start Button */
button{
  width:100%;
  margin-top:20px;
  padding:15px;
  border:none;
  border-radius:10px;
  background:#0b57d0;
  color:white;
  font-size:18px;
  cursor:pointer;
  transition:.3s;
}

button:hover{
  transform:scale(1.02);
}

.instructions{
  margin-top:15px;
  color:#555;
  line-height:1.7;
}
</style>
</head>
<body>

<!-- LOADING -->
<div id="loader">
  <div class="loader-circle"></div>
  <div class="loader-text">
    Julio Maths CBT
  </div>
</div>

<!-- APP -->
<div id="app">

<header>
📚 Julio Maths CBT
</header>

<div class="container">

<div class="card">
<h2>SHS 1 Mathematics — Section A</h2>

<div class="info">

<div class="info-box">
<div class="label">Real Time</div>
<div class="value" id="clock">--:--</div>
</div>

<div class="info-box">
<div class="label">Exam Time</div>
<div class="value" id="timer">
30:00
</div>
</div>

</div>

<div class="instructions">
<b>Instructions:</b><br>
• Answer all 30 questions.<br>
• Choose only one answer.<br>
• Time allowed: 30 minutes.<br>
• Your score will show at the end.
</div>

<button onclick="startExam()">
🚀 Start Exam
</button>

</div>

</div>

</div>

<script>

/* Show App After Loading */
setTimeout(()=>{
  document.getElementById("app").style.display="block";
  document.body.style.overflow="auto";
},3000);

/* Real Time Clock */
function updateClock(){
  const now = new Date();

  let hours = now.getHours();
  let mins = now.getMinutes();

  mins = mins < 10 ? "0"+mins : mins;

  document.getElementById("clock")
  .innerText = hours + ":" + mins;
}

setInterval(updateClock,1000);
updateClock();

/* Start Exam */
function startExam(){
  alert("Part 2 will begin the exam 😏");
}

</script>

</body>
</html>
