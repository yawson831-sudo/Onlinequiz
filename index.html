<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Student Results Portal</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #0f172a;
      color: white;
      text-align: center;
      padding: 40px;
    }

    .container {
      background: #1e293b;
      padding: 20px;
      border-radius: 10px;
      width: 90%;
      max-width: 500px;
      margin: auto;
      margin-bottom: 20px;
    }

    input {
      width: 90%;
      padding: 12px;
      margin: 10px 0;
      border: none;
      border-radius: 6px;
    }

    button {
      padding: 12px 20px;
      background: #22c55e;
      border: none;
      color: white;
      border-radius: 6px;
      cursor: pointer;
      font-size: 16px;
    }

    button:hover {
      background: #16a34a;
    }

    .result {
      margin-top: 20px;
      background: #0b1220;
      padding: 15px;
      border-radius: 8px;
      display: none;
      text-align: left;
    }

    .status {
      margin-top: 15px;
      font-weight: bold;
      color: #38bdf8;
    }
  </style>
</head>

<body>

  <!-- 🔍 STUDENT CHECKER -->
  <div class="container">
    <h1>📊 Student Results Portal</h1>

    <input type="text" id="indexNo" placeholder="Enter Index Number">
    <button onclick="checkResult()">Check Result</button>

    <div class="status" id="status"></div>

    <div class="result" id="resultBox">
      <h3>Result Details</h3>
      <p id="studentInfo"></p>
    </div>
  </div>

  <!-- 🧑‍🏫 ADMIN PANEL -->
  <div class="container">
    <h2>🧑‍🏫 Admin Panel</h2>

    <input type="text" id="newIndex" placeholder="Index Number">
    <input type="text" id="newName" placeholder="Student Name">
    <input type="number" id="newScore" placeholder="Score">

    <button onclick="addStudent()">➕ Add Student</button>

    <p id="adminStatus"></p>
  </div>

  <script>

    // 💾 Load saved students OR empty array
    let students = JSON.parse(localStorage.getItem("students")) || [];

    // 📊 CHECK RESULT
    function checkResult() {
      const index = document.getElementById("indexNo").value;
      const status = document.getElementById("status");
      const resultBox = document.getElementById("resultBox");
      const info = document.getElementById("studentInfo");

      const student = students.find(s => s.index === index);

      if (!student) {
        status.innerText = "❌ Student not found";
        resultBox.style.display = "none";
        return;
      }

      status.innerText = "✅ Result Found";
      resultBox.style.display = "block";

      info.innerHTML = `
        <b>Name:</b> ${student.name}<br>
        <b>Index:</b> ${student.index}<br>
        <b>Score:</b> ${student.score}<br>
        <b>Grade:</b> ${student.grade}
      `;

      sendWhatsApp(student);
    }

    // 📲 WHATSAPP SENDER
    function sendWhatsApp(student) {
      const phoneNumber = "233XXXXXXXXX"; // 🔁 CHANGE THIS

      const message =
        `Hello ${student.name}, your result is ready:%0A` +
        `Index: ${student.index}%0A` +
        `Score: ${student.score}%0A` +
        `Grade: ${student.grade}`;

      const url = `https://wa.me/${phoneNumber}?text=${message}`;

      window.open(url, "_blank");
    }

    // 🧑‍🏫 ADD STUDENT (ADMIN)
    function addStudent() {
      const index = document.getElementById("newIndex").value;
      const name = document.getElementById("newName").value;
      const score = parseInt(document.getElementById("newScore").value);
      const adminStatus = document.getElementById("adminStatus");

      if (!index || !name || isNaN(score)) {
        adminStatus.innerText = "❌ Fill all fields";
        return;
      }

      let grade = "";

      if (score >= 80) grade = "A";
      else if (score >= 70) grade = "B";
      else if (score >= 60) grade = "C";
      else if (score >= 50) grade = "D";
      else grade = "F";

      const newStudent = { index, name, score, grade };

      students.push(newStudent);

      localStorage.setItem("students", JSON.stringify(students));

      adminStatus.innerText = "✅ Student added successfully!";
    }

  </script>

</body>
</html>
