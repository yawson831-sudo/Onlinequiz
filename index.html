<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>School Results App</title>

<style>
body{
  margin:0;
  font-family:Arial;
  background:#0b1220;
  color:white;
}

header{
  background:#1e293b;
  padding:15px;
  text-align:center;
  font-weight:bold;
}

nav{
  position:fixed;
  bottom:0;
  width:100%;
  display:flex;
  background:#1e293b;
}

nav button{
  flex:1;
  padding:12px;
  border:none;
  background:none;
  color:white;
}

.page{
  display:none;
  padding:20px;
  padding-bottom:80px;
}

.active{
  display:block;
}

.card{
  background:#111827;
  padding:12px;
  border-radius:10px;
  margin-top:10px;
}

input{
  width:100%;
  padding:12px;
  margin-top:10px;
  border:none;
  border-radius:6px;
}

button.action{
  width:100%;
  padding:12px;
  margin-top:10px;
  background:#22c55e;
  border:none;
  color:white;
  border-radius:6px;
}

.resultBox{
  background:#111827;
  padding:10px;
  margin-top:10px;
  border-radius:8px;
  display:none;
}
</style>
</head>

<body>

<header>📱 School Results System</header>

<!-- HOME -->
<div id="home" class="page active">

<h3>🎓 Check Result</h3>

<input id="indexInput" placeholder="Enter Index Number">
<button class="action" onclick="checkResult()">Search</button>

<div class="resultBox" id="resultBox">
<p id="resultText"></p>
</div>

</div>

<!-- RESULTS -->
<div id="results" class="page">

<h3>📊 All Results</h3>
<div id="allResults"></div>

</div>

<!-- ADMIN -->
<div id="admin" class="page">

<h3>🧑‍🏫 Admin Login</h3>

<input type="password" id="pass" placeholder="Enter Password">
<button class="action" onclick="login()">Login</button>

<div id="adminPanel" style="display:none">

<h4>Add Student</h4>

<input id="aIndex" placeholder="Index">
<input id="aName" placeholder="Name">
<input id="aScore" placeholder="Score">

<button class="action" onclick="addStudent()">Add Student</button>

<p id="msg"></p>

</div>

</div>

<!-- NAV -->
<nav>
<button onclick="show('home')">Home</button>
<button onclick="show('results'); loadAll()">Results</button>
<button onclick="show('admin')">Admin</button>
</nav>

<script>

let students = JSON.parse(localStorage.getItem("students")) || [
  {index:"S001",name:"Kojo Mensah",score:85,grade:"A"},
  {index:"S002",name:"Ama Serwaa",score:70,grade:"B"}
];

// PAGE SWITCH
function show(page){
  document.querySelectorAll(".page").forEach(p=>p.classList.remove("active"));
  document.getElementById(page).classList.add("active");
}

// CHECK RESULT
function checkResult(){
  let index = document.getElementById("indexInput").value;

  let data = JSON.parse(localStorage.getItem("students")) || students;

  let found = data.find(s=>s.index===index);

  let box = document.getElementById("resultBox");
  let text = document.getElementById("resultText");

  if(!found){
    text.innerHTML="❌ Not Found";
    box.style.display="block";
    return;
  }

  text.innerHTML=`
  <b>${found.name}</b><br>
  ${found.index}<br>
  Score: ${found.score}<br>
  Grade: ${found.grade}
  `;

  box.style.display="block";

  sendWhatsApp(found);
}

// WHATSAPP
function sendWhatsApp(s){
  let phone="233208333632";

  let msg=`Result:%0A${s.name}%0A${s.score}%0A${s.grade}`;

  window.open(`https://wa.me/${phone}?text=${msg}`,"_blank");
}

// LOAD ALL (FIXED)
function loadAll(){
  let div=document.getElementById("allResults");
  div.innerHTML="";

  let data = JSON.parse(localStorage.getItem("students")) || [];

  if(data.length===0){
    div.innerHTML="❌ No students yet";
    return;
  }

  data.forEach(s=>{
    div.innerHTML+=`
    <div class="card">
    <b>${s.name}</b><br>
    ${s.index} | ${s.score} | ${s.grade}
    </div>`;
  });
}

// LOGIN
function login(){
  let p=document.getElementById("pass").value;

  if(p==="admin123"){
    document.getElementById("adminPanel").style.display="block";
  }else{
    alert("Wrong password");
  }
}

// ADD STUDENT (FIXED)
function addStudent(){
  let i=document.getElementById("aIndex").value;
  let n=document.getElementById("aName").value;
  let s=parseInt(document.getElementById("aScore").value);

  if(!i||!n||isNaN(s)){
    document.getElementById("msg").innerText="❌ Fill all fields";
    return;
  }

  let g=s>=80?"A":s>=70?"B":s>=60?"C":s>=50?"D":"F";

  let data = JSON.parse(localStorage.getItem("students")) || [];

  data.push({index:i,name:n,score:s,grade:g});

  localStorage.setItem("students",JSON.stringify(data));

  document.getElementById("msg").innerText="✅ Added";

  loadAll(); // 🔥 FIX: instant update
}

</script>

</body>
</html>
