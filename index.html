<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>SHS Ghana Curriculum</title>

<style>
body{
margin:0;
font-family:"Segoe UI",sans-serif;
background:url('images/Screenshot_20260522-114440.jpg')
center/cover no-repeat;
color:white;
}

#loader{
position:fixed;
width:100%;
height:100vh;
background:#0f172a;
display:flex;
justify-content:center;
align-items:center;
z-index:9999;
}

header{
background:linear-gradient(
90deg,#0b5ed7,#198754
);
padding:15px;
text-align:center;
box-shadow:0 2px 15px rgba(0,0,0,.3);
}

.card{
background:rgba(0,0,0,.1);
background:rgba(0,0,0,0.6);
padding:20px;
border-radius:15px;
max-width:700px;
margin:20px auto;
}

.page{
display:none;
padding:20px;
}

.page.active{
display:block;
}

input{
width:100%;
padding:12px;
border:none;
border-radius:8px;
margin-bottom:15px;
font-size:16px;
}

button{
background:linear-gradient(
45deg,#0b5ed7,#198754
);
border:none;
padding:12px 20px;
border-radius:10px;
color:white;
font-size:16px;
font-weight:bold;
cursor:pointer;
}

.option{
background:rgba(255,255,255,.1);
padding:15px;
border-radius:10px;
margin-bottom:10px;
cursor:pointer;
border:2px solid transparent;
}

.option:hover{
border:2px solid #4ade80;
}

.selected{
border:2px solid #4ade80;
background:rgba(74,222,128,.2);
}
</style>
</head>

<body>

<div id="loader">
<h1>Loading SHS Portal...</h1>
</div>

<header>
<h1>SHS Ghana Curriculum</h1>
<p>Social Studies Assignment</p>
</header>

<!-- HOME -->
<div class="page active" id="home">

<div class="card">

<h2>Welcome 👋</h2>

<p>
Complete all questions carefully.
You cannot skip or go back.
</p>

<button onclick="go('details')">
Start Assignment
</button>

</div>
</div>

<!-- DETAILS -->
<div class="page" id="details">

<div class="card">

<h2>Student Details</h2>

<input
id="name"
placeholder="Full Name"
>

<input
id="school"
placeholder="School Name"
>

<input
id="phone"
placeholder="Phone Number"
>

<input
id="index"
placeholder="Index Number"
>

<button onclick="saveDetails()">
Continue
</button>

</div>
</div>

<!-- QUIZ -->
<div class="page" id="quiz">

<div class="card">

<h2 id="questionNumber">
Question 1/10
</h2>

<h3 id="questionText"></h3>

<div id="optionsBox"></div>

<button onclick="nextQuestion()">
Next
</button>

</div>
</div>

<script>

/* FAST LOADER */
setTimeout(()=>{
document.getElementById(
"loader"
).style.display="none";
},800);

/* BLOCK BACK BUTTON */
history.pushState(
null,null,
location.href
);

window.onpopstate=
function(){
history.go(1);
};

/* QUESTIONS */
const questions=[

{
q:"What is citizenship?",
options:[
"Being a member of a country",
"Playing football",
"Going to school",
"Sleeping"
],
answer:0
},

{
q:"Which is a moral value?",
options:[
"Stealing",
"Honesty",
"Fighting",
"Insulting"
],
answer:1
},

{
q:"Who is a citizen?",
options:[
"A visitor",
"A member of a country",
"A tourist",
"A stranger"
],
answer:1
},

{
q:"Which is a responsibility of a citizen?",
options:[
"Destroy property",
"Voting",
"Fighting",
"Stealing"
],
answer:1
},

{
q:"What promotes peace?",
options:[
"Violence",
"Unity",
"Fighting",
"Hatred"
],
answer:1
},

{
q:"Which is a national symbol?",
options:[
"Football",
"Flag",
"Shoe",
"Book"
],
answer:1
},

{
q:"What helps development?",
options:[
"Education",
"Violence",
"Stealing",
"Laziness"
],
answer:0
},

{
q:"What is good behaviour?",
options:[
"Respect",
"Insult",
"Fighting",
"Lying"
],
answer:0
},

{
q:"Who leads a community?",
options:[
"Chief",
"Driver",
"Tailor",
"Farmer"
],
answer:0
},

{
q:"What should citizens obey?",
options:[
"Laws",
"Rumours",
"Violence",
"Confusion"
],
answer:0
}

];

let currentQuestion=0;
let selectedAnswer=null;

/* NAVIGATION */
function go(page){

document
.querySelectorAll(".page")
.forEach(p=>
p.classList.remove("active")
);

document
.getElementById(page)
.classList.add("active");
}

/* SAVE DETAILS */
function saveDetails(){

const name=
document
.getElementById("name")
.value.trim();

const school=
document
.getElementById("school")
.value.trim();

const phone=
document
.getElementById("phone")
.value.trim();

const index=
document
.getElementById("index")
.value.trim();

if(
!name||
!school||
!phone||
!index
){
alert(
"Please fill all fields"
);
return;
}

const students=
JSON.parse(
localStorage.getItem(
"students"
)||"{}"
);

students[index]={
name,
school,
phone,
index,
answers:[]
};

localStorage.setItem(
"students",
JSON.stringify(students)
);

localStorage.setItem(
"currentIndex",
index
);

go("quiz");

loadQuestion();
}

/* LOAD QUESTION */
function loadQuestion(){

selectedAnswer=null;

const q=
questions[currentQuestion];

document
.getElementById(
"questionNumber"
).innerText=
`Question ${
currentQuestion+1
}/10`;

document
.getElementById(
"questionText"
).innerText=
q.q;

const box=
document
.getElementById(
"optionsBox"
);

box.innerHTML="";

q.options.forEach(
(option,index)=>{

box.innerHTML+=`

<div
class="option"
onclick="selectAnswer(
${index},this
)"
>
${option}
</div>
`;
});
}

/* SELECT */
function selectAnswer(
index,el
){

selectedAnswer=index;

document
.querySelectorAll(
".option"
)
.forEach(o=>
o.classList.remove(
"selected"
)
);

el.classList.add(
"selected"
);
}
/* NEXT QUESTION */
function nextQuestion(){

if(selectedAnswer===null){
alert(
"Please select an answer first"
);
return;
}

const index =
localStorage.getItem(
"currentIndex"
);

const students =
JSON.parse(
localStorage.getItem(
"students"
)||"{}"
);

/* SAVE ANSWER */
students[index]
.answers[currentQuestion]
=
selectedAnswer;

localStorage.setItem(
"students",
JSON.stringify(
students
)
);

/* MOVE TO NEXT */
currentQuestion++;

if(
currentQuestion <
questions.length
){
loadQuestion();
return;
}

/* SUBMIT */
submitAssignment();
}

/* SUBMIT */
function submitAssignment(){

const index =
localStorage.getItem(
"currentIndex"
);

const students =
JSON.parse(
localStorage.getItem(
"students"
)||"{}"
);

const s =
students[index];

let answersText="";

s.answers.forEach(
(ans,i)=>{

answersText +=

`Q${i+1}: ${
questions[i]
.options[ans]
}

`;
});

/* SEND TO YOUR WHATSAPP */

  alert(
"Assignment Submitted ✅"
);

/* RESET */
go("home");
}

/* CLOSE SCRIPT */
</script>

</body>
</html>
