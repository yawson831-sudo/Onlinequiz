<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Julio Maths CBT</title>

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

body{
  font-family:Arial, sans-serif;
  background:#f5f5f5;
  overflow:hidden;
}

/* Loading Screen */
#loader{
  position:fixed;
  width:100%;
  height:100vh;
  background:#ffffff;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  z-index:9999;
  animation:fadeOut 1s ease forwards;
  animation-delay:3s;
}

.loader-circle{
  width:60px;
  height:60px;
  border:6px solid #ddd;
  border-top:6px solid #0b57d0;
  border-radius:50%;
  animation:spin 1s linear infinite;
}

.loader-text{
  margin-top:20px;
  font-size:22px;
  font-weight:bold;
  color:#0b57d0;
}

@keyframes spin{
  100%{
    transform:rotate(360deg);
  }
}

@keyframes fadeOut{
  to{
    opacity:0;
    visibility:hidden;
  }
}

/* Main App */
#app{
  display:none;
  animation:slideUp .7s ease;
}

@keyframes slideUp{
  from{
    opacity:0;
    transform:translateY(30px);
  }
  to{
    opacity:1;
    transform:translateY(0);
  }
}

/* Header */
header{
  background:#0b57d0;
  color:white;
  text-align:center;
  padding:18px;
  font-size:22px;
  font-weight:bold;
  box-shadow:0 2px 8px rgba(0,0,0,.2);
}

/* Container */
.container{
  padding:20px;
}

/* Card */
.card{
  background:white;
  border-radius:14px;
  padding:20px;
  margin-top:20px;
  box-shadow:0 2px 12px rgba(0,0,0,.1);
}

/* Info */
.info{
  display:flex;
  justify-content:space-between;
  margin-top:10px;
}

.info-box{
  background:#f1f5f9;
  padding:12px;
  border-radius:10px;
  width:48%;
  text-align:center;
}

.label{
  font-size:13px;
  color:gray;
}

.value{
  font-size:18px;
  font-weight:bold;
  margin-top:4px;
}

/* Start Button */
button{
  width:100%;
  margin-top:20px;
  padding:15px;
  border:none;
  border-radius:10px;
  background:#0b57d0;
  color:white;
  font-size:18px;
  cursor:pointer;
  transition:.3s;
}

button:hover{
  transform:scale(1.02);
}

.instructions{
  margin-top:15px;
  color:#555;
  line-height:1.7;
}
</style>
</head>
<body>

<!-- LOADING -->
<div id="loader">
  <div class="loader-circle"></div>
  <div class="loader-text">
    Julio Maths CBT
  </div>
</div>

<!-- APP -->
<div id="app">

<header>
📚 Julio Maths CBT
</header>

<div class="container">

<div class="card">
<h2>SHS 1 Mathematics — Section A</h2>

<div class="info">

<div class="info-box">
<div class="label">Real Time</div>
<div class="value" id="clock">--:--</div>
</div>

<div class="info-box">
<div class="label">Exam Time</div>
<div class="value" id="timer">
30:00
</div>
</div>

</div>

<div class="instructions">
<b>Instructions:</b><br>
• Answer all 30 questions.<br>
• Choose only one answer.<br>
• Time allowed: 30 minutes.<br>
• Your score will show at the end.
</div>

<button onclick="startExam()">
🚀 Start Exam
</button>

</div>

</div>

</div>

<script>

/* Show App After Loading */
setTimeout(()=>{
  document.getElementById("app").style.display="block";
  document.body.style.overflow="auto";
},3000);

/* Real Time Clock */
function updateClock(){
  const now = new Date();

  let hours = now.getHours();
  let mins = now.getMinutes();

  mins = mins < 10 ? "0"+mins : mins;

  document.getElementById("clock")
  .innerText = hours + ":" + mins;
}

setInterval(updateClock,1000);
updateClock();

/* Start Exam */
function startExam(){

document.querySelector(".container").innerHTML = `

<div class="card">

<div style="display:flex;justify-content:space-between;">
<h3>Question <span id="qNo">1</span>/30</h3>
<h3>⏱️ <span id="countdown">30:00</span></h3>
</div>

<div style="margin-top:20px;">
<h2 id="questionText"></h2>
</div>

<div id="options" style="margin-top:20px;"></div>

<div style="display:flex;gap:10px;margin-top:20px;">
<button onclick="prevQuestion()">⬅️ Previous</button>
<button onclick="nextQuestion()">Next ➡️</button>
</div>

</div>
`;

loadQuestion();
startTimer();
  }
  const questions = [

{
question:"1. Simplify: 2x + 3x",
options:["2x","5x","6x","x"],
answer:"5x"
},

{
question:"2. What is 25% of 200?",
options:["50","25","75","100"],
answer:"50"
},

{
question:"3. Solve: x + 5 = 12",
options:["5","6","7","8"],
answer:"7"
},

{
question:"4. Evaluate: 2³",
options:["6","8","9","12"],
answer:"8"
},

{
question:"5. Which of these is a set?",
options:["Beautiful girls","Tall boys","{1,2,3}","Happy students"],
answer:"{1,2,3}"
},

{
question:"6. Simplify: 10 ÷ 2",
options:["2","3","5","10"],
answer:"5"
},

{
question:"7. Express 0.5 as a percentage",
options:["5%","10%","50%","100%"],
answer:"50%"
},

{
question:"8. Solve: 3x = 12",
options:["2","3","4","5"],
answer:"4"
},

{
question:"9. Simplify: 4²",
options:["8","12","16","20"],
answer:"16"
},

{
question:"10. Find the ratio of 4 to 8",
options:["1:2","2:1","4:1","8:4"],
answer:"1:2"
}

];

let currentQuestion = 0;
let answers = {};
let timeLeft = 1800;
function loadQuestion(){

let q = questions[currentQuestion];

document.getElementById("qNo").innerText =
currentQuestion + 1;

document.getElementById("questionText")
.innerText = q.question;

let optionHTML = "";

q.options.forEach(opt => {

optionHTML += `
<button
style="margin-top:10px;background:#f1f5f9;color:black;"
onclick="selectAnswer('${opt}')">
${opt}
</button>
`;

});

document.getElementById("options")
.innerHTML = optionHTML;
}

function selectAnswer(answer){
answers[currentQuestion] = answer;
}

function nextQuestion(){

if(currentQuestion < questions.length - 1){
currentQuestion++;
loadQuestion();
}else{
alert("More questions coming in Part 3 😏");
}
}

function prevQuestion(){

if(currentQuestion > 0){
currentQuestion--;
loadQuestion();
}
}

function startTimer(){

const timer = setInterval(()=>{

timeLeft--;

let mins = Math.floor(timeLeft / 60);
let secs = timeLeft % 60;

secs = secs < 10 ? "0"+secs : secs;

document.getElementById("countdown")
.innerText = `${mins}:${secs}`;

if(timeLeft <= 0){
clearInterval(timer);
alert("Time Up!");
}

},1000);

   }
</script>

</body>
</html>
