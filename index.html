<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>School Results System</title>

<style>
body{
  margin:0;
  font-family:Arial;
  background:#0f172a;
  color:white;
}

/* HEADER */
header{
  background:#1e293b;
  padding:15px;
  text-align:center;
  font-size:20px;
}

/* LAYOUT */
.container{
  display:flex;
  justify-content:center;
  gap:20px;
  padding:20px;
  flex-wrap:wrap;
}

/* BOXES */
.box{
  background:#1e293b;
  padding:20px;
  border-radius:12px;
  width:320px;
}

/* INPUT */
input{
  width:90%;
  padding:10px;
  margin:8px 0;
  border:none;
  border-radius:6px;
}

/* BUTTON */
button{
  width:100%;
  padding:10px;
  background:#22c55e;
  border:none;
  color:white;
  border-radius:6px;
  cursor:pointer;
}
button:hover{background:#16a34a}

/* RESULT */
.result{
  margin-top:10px;
  background:#0b1220;
  padding:10px;
  border-radius:8px;
  display:none;
}

/* ADMIN TOGGLE */
#adminPanel{
  display:none;
}

.toggle{
  background:#38bdf8;
}
</style>
</head>

<body>

<header>
📊 School Results System
<button class="toggle" onclick="toggleAdmin()">Admin</button>
</header>

<div class="container">

<!-- STUDENT PANEL -->
<div class="box">
<h3>🎓 Student Portal</h3>

<input type="text" id="indexInput" placeholder="Enter Index Number">
<button onclick="checkResult()">Check Result</button>

<div class="result" id="resultBox">
<p id="resultText"></p>
</div>
</div>

<!-- ADMIN PANEL -->
<div class="box" id="adminPanel">
<h3>🧑‍🏫 Admin Panel</h3>

<input type="text" id="aIndex" placeholder="Index Number">
<input type="text" id="aName" placeholder="Name">
<input type="number" id="aScore" placeholder="Score">

<button onclick="addStudent()">Add Student</button>

<p id="adminMsg"></p>
</div>

</div>

<script>

let students = JSON.parse(localStorage.getItem("students")) || [
  {index:"S001", name:"Kojo Mensah", score:85, grade:"A"},
  {index:"S002", name:"Ama Serwaa", score:70, grade:"B"}
];

// 🎓 CHECK RESULT
function checkResult(){
  let index = document.getElementById("indexInput").value;
  let found = students.find(s => s.index === index);

  let box = document.getElementById("resultBox");
  let text = document.getElementById("resultText");

  if(!found){
    text.innerHTML = "❌ Not found";
    box.style.display="block";
    return;
  }

  text.innerHTML = `
  <b>Name:</b> ${found.name}<br>
  <b>Index:</b> ${found.index}<br>
  <b>Score:</b> ${found.score}<br>
  <b>Grade:</b> ${found.grade}
  `;

  box.style.display="block";

  sendWhatsApp(found);
}

// 📲 WHATSAPP
function sendWhatsApp(student){
  const phone = "233208333632";

  const msg =
  `Result Ready:%0AName: ${student.name}%0AScore: ${student.score}%0AGrade: ${student.grade}`;

  window.open(`https://wa.me/${phone}?text=${msg}`, "_blank");
}

// 🧑‍🏫 ADD STUDENT
function addStudent(){
  let index = document.getElementById("aIndex").value;
  let name = document.getElementById("aName").value;
  let score = parseInt(document.getElementById("aScore").value);
  let msg = document.getElementById("adminMsg");

  if(!index || !name || isNaN(score)){
    msg.innerText="❌ Fill all fields";
    return;
  }

  let grade = score>=80?"A":
              score>=70?"B":
              score>=60?"C":
              score>=50?"D":"F";

  students.push({index,name,score,grade});
  localStorage.setItem("students", JSON.stringify(students));

  msg.innerText="✅ Student Added";
}

// 🔐 TOGGLE ADMIN
function toggleAdmin(){
  let panel = document.getElementById("adminPanel");
  panel.style.display = panel.style.display === "none" ? "block" : "none";
}

</script>

</body>
</html>
